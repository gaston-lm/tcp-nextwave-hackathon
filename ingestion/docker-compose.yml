services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-ingestion-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../data/db_table_definitions/methods_by_provider.sql:/docker-entrypoint-initdb.d/01-methods_by_provider.sql:ro
      - ../data/db_table_definitions/providers_by_merchant.sql:/docker-entrypoint-initdb.d/02-providers_by_merchant.sql:ro
      - ../data/db_table_definitions/transactions.sql:/docker-entrypoint-initdb.d/03-transactions.sql:ro
      - ./seed_example_mappings.sql:/docker-entrypoint-initdb.d/04-seed_example_mappings.sql:ro

volumes:
  postgres_data:
