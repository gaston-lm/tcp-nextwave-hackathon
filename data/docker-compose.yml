services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: control-tower-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - control_tower_postgres_data:/var/lib/postgresql/data
      - ./schemas/methods_by_provider.sql:/docker-entrypoint-initdb.d/01-methods_by_provider.sql:ro
      - ./schemas/providers_by_merchant.sql:/docker-entrypoint-initdb.d/02-providers_by_merchant.sql:ro
      - ./schemas/transactions.sql:/docker-entrypoint-initdb.d/03-transactions.sql:ro
      - ./db_migrations/001_incidents_and_memory.sql:/docker-entrypoint-initdb.d/04-incidents.sql:ro
      - ./schemas/baseline_metrics.sql:/docker-entrypoint-initdb.d/05-baseline_metrics.sql:ro

volumes:
  control_tower_postgres_data:
